name: iOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and test
        shell: bash
        run: |
          set +e
          set -o pipefail
          device_id=$(xcrun simctl list devices available \
            | sed -nE 's/.*iPhone.*\(([0-9A-F-]{36})\).*/\1/p' \
            | head -n 1)
          if [[ -z "$device_id" ]]; then
            {
              echo '## Simulator discovery failed'
              echo '```text'
              xcrun simctl list devices available
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          xcodebuild test \
            -project StageLight.xcodeproj \
            -scheme StageLight \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            {
              echo '## Xcode diagnostics'
              echo '```text'
              tail -n 240 xcodebuild.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
